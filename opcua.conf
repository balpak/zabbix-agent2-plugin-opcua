### Option: Plugins.OPCUA.System.Path
#	Path to the OPC UA plugin executable.
#
# Mandatory: yes
# Default:
Plugins.OPCUA.System.Path=/usr/local/bin/zabbix-agent2-plugin-opcua

### Option: Plugins.OPCUA.Timeout
#	Connection and read timeout, in seconds.
#
# Mandatory: no
# Range: 1-30
# Default: <Global timeout>
# Plugins.OPCUA.Timeout=

#Plugins.OPCUA.Timeout=5

### Option: Plugins.OPCUA.Sessions.*.Endpoint
#	OPC UA server endpoint URL, e.g. opc.tcp://10.0.0.5:4840.
#	Replace "*" with a session name.
#
# Mandatory: no (but required from somewhere - key parameter, session, or Default)
# Default:
# Plugins.OPCUA.Sessions.*.Endpoint=

### Option: Plugins.OPCUA.Sessions.*.SecurityMode
#	Secure channel security mode: None, Sign or SignAndEncrypt.
#	Replace "*" with a session name.
#
# Mandatory: no
# Default: None
# Plugins.OPCUA.Sessions.*.SecurityMode=

### Option: Plugins.OPCUA.Sessions.*.SecurityPolicy
#	Secure channel security policy, e.g. Basic256Sha256. Use None to
#	disable channel-level security. This is the short policy name, not
#	the full http://opcfoundation.org/... spec URI.
#	Replace "*" with a session name.
#
# Mandatory: no
# Default: None
# Plugins.OPCUA.Sessions.*.SecurityPolicy=

### Option: Plugins.OPCUA.Sessions.*.CertFile
#	Path to the client certificate file. Required if SecurityPolicy is
#	not None.
#	Replace "*" with a session name.
#
# Mandatory: no
# Default:
# Plugins.OPCUA.Sessions.*.CertFile=

### Option: Plugins.OPCUA.Sessions.*.KeyFile
#	Path to the client private key file. Required if SecurityPolicy is
#	not None.
#	Replace "*" with a session name.
#
# Mandatory: no
# Default:
# Plugins.OPCUA.Sessions.*.KeyFile=

### Option: Plugins.OPCUA.Sessions.*.User
#	Username for OPC UA session authentication. Leave empty for
#	anonymous authentication.
#	Replace "*" with a session name.
#
# Mandatory: no
# Default:
# Plugins.OPCUA.Sessions.*.User=

### Option: Plugins.OPCUA.Sessions.*.Password
#	Password for OPC UA session authentication.
#	Replace "*" with a session name.
#
# Mandatory: no
# Default:
# Plugins.OPCUA.Sessions.*.Password=

### Option: Plugins.OPCUA.Default.Endpoint
#	Default OPC UA server endpoint URL. Used if no other value is
#	specified.
#
# Mandatory: no
# Default:
# Plugins.OPCUA.Default.Endpoint=

### Option: Plugins.OPCUA.Default.SecurityMode
#	Default secure channel security mode. Used if no other value is
#	specified.
#
# Mandatory: no
# Default: None
# Plugins.OPCUA.Default.SecurityMode=

### Option: Plugins.OPCUA.Default.SecurityPolicy
#	Default secure channel security policy. Used if no other value is
#	specified.
#
# Mandatory: no
# Default: None
# Plugins.OPCUA.Default.SecurityPolicy=

### Option: Plugins.OPCUA.Default.CertFile
#	Default client certificate file path. Used if no other value is
#	specified.
#
# Mandatory: no
# Default:
# Plugins.OPCUA.Default.CertFile=

### Option: Plugins.OPCUA.Default.KeyFile
#	Default client private key file path. Used if no other value is
#	specified.
#
# Mandatory: no
# Default:
# Plugins.OPCUA.Default.KeyFile=

### Option: Plugins.OPCUA.Default.User
#	Default username for OPC UA session authentication. Used if no
#	other value is specified.
#
# Mandatory: no
# Default:
# Plugins.OPCUA.Default.User=

### Option: Plugins.OPCUA.Default.Password
#	Default password for OPC UA session authentication. Used if no
#	other value is specified.
#
# Mandatory: no
# Default:
# Plugins.OPCUA.Default.Password=
